name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/codex-deepseek-bridge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugins/codex-deepseek-bridge/package-lock.json
      - run: npm ci
      - name: Check source syntax
        run: npm run check
      - name: Run core offline tests
        run: npm run test:core
      - name: Run MCP server smoke test
        run: npm run test:server
      - name: Build distributable MCP server
        run: npm run build
      - name: Validate plugin manifests and repository hygiene
        run: npm run validate
      - run: npm audit --omit=dev --audit-level=high
      - name: Check committed bundle is current
        run: git diff --exit-code -- dist/index.mjs
